<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task 1 - 3D Image Gallery</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="gallery-container">
    <div class="carousel">
      <!-- Replace the file names below (e.g. 1.jpg, 2.jpg) with whatever .jpg files are in your folder -->
      <div class="card" style="--i: 0;">
        <img src="1.jpg" alt="Gallery Image 1" />
      </div>
      <div class="card" style="--i: 1;">
        <img src="2.jpg" alt="Gallery Image 2" />
      </div>
      <div class="card" style="--i: 2;">
        <img src="3.jpg" alt="Gallery Image 3" />
      </div>
      <div class="card" style="--i: 3;">
        <img src="4.jpg" alt="Gallery Image 4" />
      </div>
      <div class="card" style="--i: 4;">
        <img src="5.jpg" alt="Gallery Image 5" />
      </div>
      <div class="card" style="--i: 5;">
        <img src="6.jpg" alt="Gallery Image 6" />
      </div>
    </div>
  </div>
</body>
</html>
